[project]
name = "hmh-agents"
version = "0.1.0"
description = "HMH Labz multi-tenant WhatsApp AI agent platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy[asyncio]>=2.0.35,<2.1",
    "asyncpg>=0.30,<1",
    "alembic>=1.13,<2",
    "pgvector>=0.3.6,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "redis>=5.1,<6",
    "arq>=0.26,<1",
    "structlog>=24.4",
    "cryptography>=43",
    "httpx>=0.27,<1",
    "jinja2>=3.1",
    "fastembed>=0.4",
    "pyjwt>=2.9,<3",
    "openpyxl>=3.1,<4",
    "pyotp>=2.9,<3",
    "segno>=1.6,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=5",
    "asgi-lifespan>=2.1",
    "mypy>=1.13",
    "ruff>=0.7",
    "types-openpyxl>=3.1.5.20260827",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["dashboard", "*.md"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "S", "ASYNC", "BLE", "C4", "DTZ", "PT", "RET", "SIM",
    "TID", "RUF", "E722",
]
ignore = [
    "S101",  # assert is fine in tests; production code uses explicit raises
]

[tool.ruff.lint.per-file-ignores]
"api/tests/**" = ["S105", "S106", "S311"]
"api/db/migrations/**" = ["E501"]
"api/agents/canned.py" = ["E501"]  # customer-facing copy: one reviewable line per language
"api/modules/*/module.py" = ["E501"]  # spec prompt text, kept byte-exact
"api/agents/prompts/compose.py" = ["E501"]
"api/tests/test_conversations.py" = ["E501"]
"api/onboarding/*.py" = ["RUF001"]  # Arabic letters in header synonyms and name folding
"api/tests/test_import_excel.py" = ["RUF001", "E501", "DTZ001"]  # scripted model replies read best on one line

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
files = ["api"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pgvector.*", "fastembed.*", "asyncpg.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["api/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["api"]
omit = ["api/tests/*", "api/db/migrations/*"]
