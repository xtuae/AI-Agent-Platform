AWSTemplateFormatVersion: "2010-09-09"
# DEPLOY_GUIDE.md Appendix A.2 as one stack: the m7i-flex.large server that runs the whole
# docker-compose stack (with docker-compose.aws.yml). Deleting the stack removes everything,
# including the disk: take a backup (Part 14) first.
#
#   aws cloudformation deploy --stack-name hmh-agents --template-file deploy/aws/ec2-free-tier.yaml \
#     --parameter-overrides VpcId=vpc-... AdminCidr=203.0.113.25/32 "PublicKey=$(cat ~/.ssh/id_ed25519.pub)"
Description: HMH Labz agent platform - single EC2 server (AWS free tier sizing)

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: The account's default VPC
  AdminCidr:
    Type: String
    Description: Your IP as a.b.c.d/32 - the only source allowed on port 22 (removed in A.4)
    AllowedPattern: '^\d{1,3}(\.\d{1,3}){3}/32$'
  PublicKey:
    Type: String
    Description: Contents of ~/.ssh/id_ed25519.pub
  InstanceType:
    Type: String
    Default: m7i-flex.large
    Description: Change to m7i.xlarge or bigger when scaling (Appendix A.8)
  AllowSsh22:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Set to false after the guide moves SSH to port 2222 (Appendix A.4)
  UbuntuAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id

Conditions:
  Ssh22: !Equals [!Ref AllowSsh22, "true"]

Resources:
  KeyPair:
    Type: AWS::EC2::KeyPair
    Properties:
      KeyName: hmh-mac
      PublicKeyMaterial: !Ref PublicKey

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: hmh-agents
      GroupDescription: HMH agents - SSH on 2222, web on 80 and 443
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - !If
          - Ssh22
          - { IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: !Ref AdminCidr, Description: first login only }
          - !Ref AWS::NoValue
        - { IpProtocol: tcp, FromPort: 2222, ToPort: 2222, CidrIp: 0.0.0.0/0, Description: SSH key-only plus fail2ban }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: HTTP to HTTPS redirect }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: HTTPS }
        - { IpProtocol: udp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: HTTP/3 }

  Server:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref UbuntuAmi
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyPair
      SecurityGroupIds: [!GetAtt SecurityGroup.GroupId]
      # IMDSv2 only; hop limit 2 so a container could reach it (the app itself never does)
      MetadataOptions: { HttpTokens: required, HttpPutResponseHopLimit: 2, HttpEndpoint: enabled }
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs: { VolumeSize: 30, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true }
      Tags:
        - { Key: Name, Value: hmh-agents }

  ElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref Server
      Tags:
        - { Key: Name, Value: hmh-agents }

Outputs:
  ServerIp:
    Description: YOUR_SERVER_IP in DEPLOY_GUIDE.md
    Value: !Ref ElasticIp
  InstanceId:
    Value: !Ref Server
